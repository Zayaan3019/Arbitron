services:
  - type: web
    name: arbitron-api
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: ARBITRON_CORS_ORIGIN
        value: "*"
      - key: ARBITRON_CACHE_DIR
        value: /tmp/arbitron_cache
