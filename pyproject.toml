[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitron"
version = "0.1.0"
description = "Autonomous Quant Research Agent — LLM + walk-forward backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Zayaan S" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "openai>=1.40",
    "yfinance>=0.2.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
hmm = ["hmmlearn>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
arbitron = "arbitron.agent.loop:_cli"
research  = "research:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arbitron*", "api*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
